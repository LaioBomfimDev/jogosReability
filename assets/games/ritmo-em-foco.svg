<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Ritmo em Foco</title>
  <desc id="desc">Quatro pistas de ritmo com pulsos coloridos chegando a uma linha dourada.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061b31" />
      <stop offset="0.62" stop-color="#0b243a" />
      <stop offset="1" stop-color="#102e49" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6" />
      <stop offset="1" stop-color="#efe8d7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#061b31" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="#f7f4ea" />
  <rect x="54" y="46" width="852" height="448" rx="36" fill="url(#paper)" stroke="#d7d0be" />

  <g filter="url(#shadow)">
    <rect x="120" y="82" width="424" height="376" rx="24" fill="url(#stage)" />
    <g opacity="0.15" fill="#ffffff">
      <rect x="226" y="82" width="1" height="376" />
      <rect x="332" y="82" width="1" height="376" />
      <rect x="438" y="82" width="1" height="376" />
      <rect x="120" y="82" width="106" height="376" />
      <rect x="332" y="82" width="106" height="376" />
    </g>
    <rect x="120" y="382" width="424" height="5" fill="#b8aa60" />
    <g opacity="0.34">
      <rect x="135" y="358" width="78" height="50" rx="15" fill="#d8c76b" />
      <rect x="241" y="358" width="78" height="50" rx="15" fill="#93b399" />
      <rect x="347" y="358" width="78" height="50" rx="15" fill="#d8a76b" />
      <rect x="453" y="358" width="78" height="50" rx="15" fill="#8eaebd" />
    </g>
    <g stroke="#071523" stroke-width="4">
      <rect x="142" y="258" width="64" height="34" rx="12" fill="#d8c76b" />
      <rect x="248" y="190" width="64" height="34" rx="12" fill="#93b399" />
      <rect x="354" y="308" width="64" height="34" rx="12" fill="#d8a76b" />
      <rect x="460" y="126" width="64" height="34" rx="12" fill="#8eaebd" />
      <rect x="142" y="118" width="64" height="34" rx="12" fill="#d8c76b" opacity="0.8" />
      <rect x="354" y="152" width="64" height="34" rx="12" fill="#d8a76b" opacity="0.8" />
    </g>
    <g fill="#fffdf6" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="900" font-size="24" text-anchor="middle">
      <text x="173" y="438">D</text>
      <text x="279" y="438">F</text>
      <text x="385" y="438">J</text>
      <text x="491" y="438">K</text>
    </g>
  </g>

  <g transform="translate(598 142)">
    <text x="0" y="0" fill="#857536" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="900">JOGO 11 · 3 RITMOS</text>
    <text x="0" y="66" fill="#061b31" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="800">Ritmo</text>
    <text x="0" y="128" fill="#061b31" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="800">em Foco</text>
    <text x="0" y="178" fill="#3e4142" font-family="Georgia, 'Times New Roman', serif" font-size="24">atenção, tempo de resposta</text>
    <text x="0" y="210" fill="#3e4142" font-family="Georgia, 'Times New Roman', serif" font-size="24">e coordenação</text>
    <g transform="translate(0 252)">
      <rect width="188" height="46" rx="23" fill="#b8aa60" />
      <text x="94" y="30" fill="#071523" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="900" text-anchor="middle">JOGAR AGORA</text>
    </g>
  </g>
</svg>
