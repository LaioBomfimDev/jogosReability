<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Reability</title><link rel="stylesheet" href="/reability.css"><link rel="stylesheet" href="/clinic.css"></head><body><main class="clinic-shell clinic-auth"><p class="clinic-kicker">Reability · Profissionais</p><h1>Cuidado que acompanha cada sessão.</h1><p>Acesse seus pacientes e os registros dos jogos.</p><section class="clinic-card"><h2 id="auth-title">Entrar na conta</h2><form id="auth-form" class="clinic-form"><label id="name-field" hidden>Seu nome<input name="name" maxlength="120" autocomplete="name"></label><label>E-mail<input name="email" type="email" autocomplete="username" maxlength="254" required></label><label>Senha<input name="password" type="password" minlength="8" maxlength="200" autocomplete="current-password" required></label><p id="auth-error" class="clinic-error" role="alert"></p><button id="auth-submit" class="clinic-button">Entrar</button><button id="auth-toggle" type="button" class="clinic-button secondary">Criar conta profissional</button></form></section><a href="/index.html">Conhecer os jogos</a></main><script src="/login.js" defer></script></body></html>
