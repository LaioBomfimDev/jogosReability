<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Um jogo da memória com símbolos relacionados à reabilitação neurológica."
    />
    <meta name="theme-color" content="#F7F4EA" />
    <title>Memória Visual | Reability</title>
    <link rel="icon" href="../assets/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png" />
    <link rel="manifest" href="../site.webmanifest" />
    <link rel="stylesheet" href="../reability.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="/clinic.css" />
    <link rel="stylesheet" href="/game-shell.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="game-card" aria-labelledby="game-title">
        <header class="game-hero">
          <div class="game-navigation">
            <a class="back-link" href="../index.html">← Biblioteca</a>
            <div class="brand-lock" aria-label="Reability">
              <img class="brand-mark" src="../assets/brand/logo-mark.png" alt="" />
              <p class="brand-name">Reability<small>Jogos cognitivos</small></p>
            </div>
          </div>
          <div class="game-hero__body">
            <div class="game-hero__copy">
              <div class="game-hero__meta">
                <span class="game-hero__number">Jogo 03</span>
                <p class="eyebrow">Memória e reconhecimento</p>
              </div>
              <h1 id="game-title">Memória Visual</h1>
              <p class="intro">Escolha um nível, encontre os pares e exercite a atenção de um jeito leve.</p>
            </div>
            <div class="game-hero__visual" aria-hidden="true">
              <img src="../assets/games/home/memoria-visual-960.jpg" alt="" />
            </div>
          </div>
        </header>

        <section id="start-screen" class="start-screen" data-game-screen aria-labelledby="difficulty-title">
          <h2 id="difficulty-title">Configure a partida</h2>
          <p id="daily-status" class="daily-status" aria-live="polite"></p>
          <div class="difficulty-options">
            <button class="difficulty-option" type="button" data-level="easy">
              <span>Fácil</span>
              <strong>6 pares</strong>
              <small>Boa meta: 16 tentativas. Destaque: 12.</small>
            </button>
            <button class="difficulty-option" type="button" data-level="medium">
              <span>Médio</span>
              <strong>8 pares</strong>
              <small>Boa meta: 24 tentativas. Destaque: 18.</small>
            </button>
            <button class="difficulty-option" type="button" data-level="hard">
              <span>Difícil</span>
              <strong>10 pares</strong>
              <small>Boa meta: 34 tentativas. Destaque: 26.</small>
            </button>
          </div>
          <div class="game-config-grid">
            <label class="game-config-field">Tempo da partida
              <select id="memory-time-limit"><option value="0">Livre</option><option value="60">60 segundos</option><option value="90" selected>90 segundos</option><option value="120">120 segundos</option><option value="180">180 segundos</option></select>
              <small>O relógio encerra somente esta partida.</small>
            </label>
            <label class="game-config-field">Exibição após erro
              <select id="memory-reveal-time"><option value="400">0,4 segundo</option><option value="700" selected>0,7 segundo</option><option value="1000">1 segundo</option><option value="1500">1,5 segundo</option></select>
              <small>Tempo para observar as duas cartas diferentes.</small>
            </label>
          </div>
          <button id="memory-start-button" class="button button-primary" type="button">Começar partida</button>
        </section>

        <section id="game-area" class="game-area" data-game-screen hidden>
          <p id="selected-level" class="selected-level"></p>
          <p id="game-daily-status" class="daily-status" aria-live="polite"></p>

          <div class="game-status" aria-label="Status do jogo">
            <p>Pares <strong id="matches">0</strong>/<span id="total-matches">8</span></p>
            <p>Tentativas <strong id="moves">0</strong></p>
            <p>Tempo <strong id="timer">00:00</strong></p>
          </div>

          <div
            id="game-board"
            class="game-board"
            role="group"
            aria-label="Cartas do jogo da memória"
          ></div>

          <div class="game-actions">
            <button id="restart-button" class="button button-secondary" type="button">
              Recomeçar jogo
            </button>
            <button id="change-level-button" class="button button-tertiary" type="button">
              Trocar nível
            </button>
            <button id="share-button" class="button button-primary" type="button">
              Compartilhar desafio
            </button>
          </div>

          <p id="share-feedback" class="feedback" aria-live="polite"></p>
        </section>
      </section>
    </main>

    <dialog id="victory-dialog" class="victory-dialog" aria-labelledby="victory-title">
      <div class="victory-content">
        <p class="eyebrow">Parabéns!</p>
        <h2 id="victory-title">Você encontrou todos os pares.</h2>
        <p id="victory-summary"></p>
        <button id="play-again-button" class="button button-primary" type="button">
          Jogar novamente
        </button>
      </div>
    </dialog>

    <script src="/clinic-local.js" defer></script><script src="/clinic.js" defer></script>
    <script src="../daily-play.js" defer></script>
    <script src="./script.js" defer></script>
    <script src="../disclaimer.js" defer></script>
  </body>
</html>
