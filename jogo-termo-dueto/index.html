<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Dueto: resolva duas palavras de cinco letras ao mesmo tempo."
    />
    <meta name="theme-color" content="#F7F4EA" />
    <title>Dueto | Reability</title>
    <link rel="icon" href="../assets/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png" />
    <link rel="manifest" href="../site.webmanifest" />
    <link rel="stylesheet" href="../reability.css" />
    <link rel="stylesheet" href="../jogo-termo-core/styles.css" />
    <link rel="stylesheet" href="/clinic.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="game-card" aria-labelledby="game-title">
        <div class="game-navigation">
          <a class="back-link" href="../index.html">← Voltar aos jogos</a>
          <div class="brand-lock" aria-label="Reability">
            <img class="brand-mark" src="../assets/brand/logo-mark.png" alt="Símbolo Reability" />
            <p class="brand-name">Reability<small>Jogos da clínica</small></p>
          </div>
        </div>

        <p class="eyebrow">Linguagem e atenção</p>
        <h1 id="game-title">Dueto</h1>
        <p class="intro">
          Um palpite alimenta dois tabuleiros. Use as pistas em paralelo para fechar as duas palavras.
        </p>

        <section id="word-game" class="word-game" aria-labelledby="game-title">
          <nav class="mode-links" aria-label="Modos de palavras">
            <a class="mode-link" data-mode="unico" href="../jogo-termo-unico/index.html">Palavra Secreta</a>
            <a class="mode-link" data-mode="dueto" href="../jogo-termo-dueto/index.html">Dueto</a>
            <a class="mode-link" data-mode="quarteto" href="../jogo-termo-quarteto/index.html">Quarteto</a>
          </nav>

          <p id="daily-status" class="daily-status" aria-live="polite"></p>

          <div class="game-toolbar">
            <div class="game-stats" aria-live="polite">
              <p>Tentativas <strong id="attempt-count">0/7</strong></p>
              <p>Resolvidas <strong id="solved-count">0/2</strong></p>
              <p>Rodada <strong id="round-label">Livre</strong></p>
            </div>
            <label class="contrast-toggle">
              <input id="contrast-toggle" type="checkbox" />
              Alto contraste
            </label>
          </div>

          <p id="game-message" class="game-message" aria-live="polite"></p>
          <div id="boards" class="boards boards--dueto" aria-label="Tabuleiros de palavras"></div>

          <form id="guess-form" class="guess-form">
            <label for="guess-input">Palpite</label>
            <div class="guess-input-row">
              <input
                id="guess-input"
                name="guess"
                type="text"
                inputmode="text"
                maxlength="5"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                required
              />
              <button id="submit-button" class="button button-primary" type="submit">Enviar</button>
            </div>
          </form>

          <div id="keyboard" class="keyboard" aria-label="Teclado de letras"></div>

          <div class="game-actions">
            <button id="new-game-button" class="button button-secondary" type="button">Nova rodada</button>
            <button id="share-button" class="button button-secondary" type="button" disabled>
              Copiar resultado
            </button>
          </div>
        </section>
      </section>
    </main>

    <dialog id="result-dialog" class="result-dialog" aria-labelledby="result-title">
      <div class="result-dialog__content">
        <p id="result-eyebrow" class="eyebrow">Desafio concluído</p>
        <h2 id="result-title">Dueto</h2>
        <p id="result-summary"></p>
        <div class="result-dialog__actions">
          <button id="play-again-button" class="button button-primary" type="button">Jogar de novo</button>
          <button id="dialog-share-button" class="button button-secondary" type="button">Copiar resultado</button>
          <a class="button button-secondary" href="../index.html">Ver outros jogos</a>
        </div>
      </div>
    </dialog>

    <script>
      window.WORD_GAME_CONFIG = {
        mode: "dueto",
        title: "Dueto",
        boardCount: 2,
        maxAttempts: 7,
      };
    </script>
    <script src="/clinic-local.js" defer></script><script src="/clinic.js" defer></script>
    <script src="../daily-play.js" defer></script>
    <script src="../jogo-termo-core/script.js" defer></script>
    <script src="../disclaimer.js" defer></script>
  </body>
</html>
