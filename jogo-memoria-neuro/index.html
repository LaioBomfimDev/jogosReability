<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Um jogo da memória com símbolos relacionados à reabilitação neurológica."
    />
    <meta name="theme-color" content="#F7F4EA" />
    <title>Memória Visual | Reability</title>
    <link rel="icon" href="../assets/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png" />
    <link rel="manifest" href="../site.webmanifest" />
    <link rel="stylesheet" href="../reability.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="/clinic.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="game-card" aria-labelledby="game-title">
        <div class="game-navigation">
          <a class="back-link" href="../index.html">← Voltar aos jogos</a>
          <div class="brand-lock" aria-label="Reability">
            <img class="brand-mark" src="../assets/brand/logo-mark.png" alt="Símbolo Reability" />
            <p class="brand-name">Reability<small>Jogos da clínica</small></p>
          </div>
        </div>
        <p class="eyebrow">Cuidado, ciência e humanidade</p>
        <h1 id="game-title">Memória Visual</h1>
        <p class="intro">
          Escolha um nível, encontre os pares e exercite a atenção de um jeito leve.
        </p>

        <section id="start-screen" class="start-screen" aria-labelledby="difficulty-title">
          <h2 id="difficulty-title">Escolha seu nível</h2>
          <p id="daily-status" class="daily-status" aria-live="polite"></p>
          <div class="difficulty-options">
            <button class="difficulty-option" type="button" data-level="easy">
              <span>Fácil</span>
              <strong>6 pares</strong>
              <small>Boa meta: 16 tentativas. Destaque: 12.</small>
            </button>
            <button class="difficulty-option" type="button" data-level="medium">
              <span>Médio</span>
              <strong>8 pares</strong>
              <small>Boa meta: 24 tentativas. Destaque: 18.</small>
            </button>
            <button class="difficulty-option" type="button" data-level="hard">
              <span>Difícil</span>
              <strong>10 pares</strong>
              <small>Boa meta: 34 tentativas. Destaque: 26.</small>
            </button>
          </div>
        </section>

        <section id="game-area" class="game-area" hidden>
          <p id="selected-level" class="selected-level"></p>
          <p id="game-daily-status" class="daily-status" aria-live="polite"></p>

          <div class="game-status" aria-label="Status do jogo">
            <p>Pares <strong id="matches">0</strong>/<span id="total-matches">8</span></p>
            <p>Tentativas <strong id="moves">0</strong></p>
            <p>Tempo <strong id="timer">00:00</strong></p>
          </div>

          <div
            id="game-board"
            class="game-board"
            role="group"
            aria-label="Cartas do jogo da memória"
          ></div>

          <div class="game-actions">
            <button id="restart-button" class="button button-secondary" type="button">
              Recomeçar jogo
            </button>
            <button id="change-level-button" class="button button-tertiary" type="button">
              Trocar nível
            </button>
            <button id="share-button" class="button button-primary" type="button">
              Compartilhar desafio
            </button>
          </div>

          <p id="share-feedback" class="feedback" aria-live="polite"></p>
        </section>
      </section>
    </main>

    <dialog id="victory-dialog" class="victory-dialog" aria-labelledby="victory-title">
      <div class="victory-content">
        <p class="eyebrow">Parabéns!</p>
        <h2 id="victory-title">Você encontrou todos os pares.</h2>
        <p id="victory-summary"></p>
        <button id="play-again-button" class="button button-primary" type="button">
          Jogar novamente
        </button>
      </div>
    </dialog>

    <script src="/clinic.js" defer></script>
    <script src="../daily-play.js" defer></script>
    <script src="./script.js" defer></script>
    <script src="../disclaimer.js" defer></script>
  </body>
</html>
